services:
  db:
    image: postgres:15-alpine
    container_name: hirewise_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./src/backend
    container_name: hirewise_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis
      - mcp
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - cv_storage:/data/cv_storage
    env_file:
      - .env
    environment:
      - CV_STORAGE_DIR=/data/cv_storage
      # Agent loop của web gọi tool QUA MCP server (service `mcp` cùng network).
      - MCP_SERVER_URL=http://mcp:8001/sse

  redis:
    image: redis:7-alpine
    container_name: hirewise_redis
    restart: always
    ports:
      - "6379:6379"

  worker:
    build: ./src/backend
    container_name: hirewise_worker
    restart: always
    # Worker Celery: lấy task từ Redis và chấm điểm CV nền. Dùng chung image với api.
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - db
      - redis
    volumes:
      - ./src/backend:/app
    env_file:
      - .env

  mcp:
    # DÙNG CHUNG image backend (đã có sẵn mcp + mọi deps). Mount code backend vào
    # /app và mount server.py vào /mcpsrv; PYTHONPATH=/app để import được app.*.
    build: ./src/backend
    container_name: hirewise_mcp
    restart: always
    command: python /mcpsrv/server.py
    environment:
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8001:8001"
    volumes:
      - ./src/backend:/app
      - ./src/mcp_server:/mcpsrv
  frontend:
    build: ./src/frontend
    container_name: hirewise_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      # Inside Docker the backend is reachable by service name, not localhost.
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      - api
    volumes:
      # Sync local frontend code with container for hot-reloading
      - ./src/frontend:/app
      # Prevent local node_modules from overriding container node_modules
      - /app/node_modules
volumes:
  postgres_data:
  cv_storage: