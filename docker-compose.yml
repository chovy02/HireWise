# MÚI GIỜ: mọi container đặt TZ=Asia/Ho_Chi_Minh để log/`date` đọc được theo giờ Việt
# Nam. Việc này KHÔNG ảnh hưởng tới dữ liệu: cột thời gian đều là timestamptz và code
# luôn ghi `datetime.now(timezone.utc)`, tức lưu một mốc tuyệt đối chứ không phụ thuộc
# TZ của tiến trình. Đổi TZ chỉ đổi cách CON NGƯỜI đọc, không đổi cái được lưu.
services:
  db:
    image: postgres:15-alpine
    container_name: hirewise_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Chỉ đổi cách psql IN ra timestamptz (hiện "+07" thay vì "+00"). Giá trị lưu
      # trong file dữ liệu không đổi — timestamptz luôn là một mốc tuyệt đối.
      - TZ=Asia/Ho_Chi_Minh
      - PGTZ=Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Không có healthcheck thì `depends_on` chỉ đợi container CHẠY, chứ không đợi
    # Postgres nhận kết nối — lần `up` đầu tiên còn phải initdb cả chục giây.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./src/backend
    container_name: hirewise_api
    restart: always
    # `prestart` đợi Postgres + đồng bộ schema (create_all & alembic) TRƯỚC khi
    # uvicorn nhận request. Thiếu bước này, máy nào có volume DB cũ sẽ crash ngay
    # lúc startup vì thiếu cột, và frontend chỉ hiện "Backend not reachable".
    # Chỉ service `api` chạy migration — worker/mcp dùng chung image nhưng để cả 3
    # cùng migrate sẽ đua nhau trên một DB.
    command: sh -c "python -m app.prestart && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mcp:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - cv_storage:/data/cv_storage
      # Ảnh/file HR gắn vào mẫu mail. Volume riêng vì việc gửi mail chạy trong
      # BackgroundTasks của chính service `api`, và file phải sống qua mỗi lần rebuild.
      - email_attachments:/data/email_attachments
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - CV_STORAGE_DIR=/data/cv_storage
      - EMAIL_ATTACHMENT_DIR=/data/email_attachments
      # Agent loop của web gọi tool QUA MCP server (service `mcp` cùng network).
      - MCP_SERVER_URL=http://mcp:8001/sse
      # Ngân sách token Groq đếm CHUNG cho mọi container, nên api/worker/mcp phải
      # trỏ về cùng một Redis — mỗi tiến trình đếm riêng thì cộng lại vẫn vượt trần.
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/2

  redis:
    image: redis:7-alpine
    container_name: hirewise_redis
    restart: always
    ports:
      - "6379:6379"

  worker:
    build: ./src/backend
    container_name: hirewise_worker
    restart: always
    # Worker Celery: lấy task từ Redis và chấm điểm CV nền. Dùng chung image với api.
    #
    # concurrency=4 khớp với số "ngăn" ngân sách độc lập: 2 tài khoản Groq × 2 model.
    # Không sợ bắn dồn dập như trước vì rate_limiter (Redis) mới là thứ quyết định khi
    # nào được gọi API — worker nào chưa tới lượt thì nằm chờ, không đâm vào 429.
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src/backend:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Sổ sách rate limit để ở DB 2, tách khỏi broker (DB 0) và result backend (DB 1).
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/2

  mcp:
    # DÙNG CHUNG image backend (đã có sẵn mcp + mọi deps). Mount code backend vào
    # /app và mount server.py vào /mcpsrv; PYTHONPATH=/app để import được app.*.
    build: ./src/backend
    container_name: hirewise_mcp
    restart: always
    command: python /mcpsrv/server.py
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONPATH=/app
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8001:8001"
    volumes:
      - ./src/backend:/app
      - ./src/mcp_server:/mcpsrv
  frontend:
    build: ./src/frontend
    container_name: hirewise_frontend
    restart: always
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Inside Docker the backend is reachable by service name, not localhost.
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      - api
    volumes:
      # Sync local frontend code with container for hot-reloading
      - ./src/frontend:/app
      # Prevent local node_modules from overriding container node_modules
      - /app/node_modules
volumes:
  postgres_data:
  cv_storage:
  email_attachments: